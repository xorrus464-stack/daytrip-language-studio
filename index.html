/* ============================================================
   한마디 여행 · 영어와 일본어 — design system
   ============================================================ */
:root{
  --cream:#F9F7F3;
  --cream-2:#F3EEE4;
  --paper:#FFFFFF;
  --line:#E9E3D6;
  --line-soft:#F0EBE0;
  --ink:#243129;
  --ink-2:#3E4C43;
  --muted:#8A857A;
  --green:#1B4D3E;
  --green-2:#2A6A55;
  --green-soft:#E5F0E8;
  --mint:#DDEDE2;
  --peach:#FBE6D8;
  --peach-2:#F6D0B7;
  --butter:#FBF0CC;
  --sky:#E1ECF5;
  --rose:#F9E0E4;
  --lilac:#E8E2F3;
  --gold:#E8A33D;
  --r-lg:24px;
  --r-md:18px;
  --r-sm:12px;
  --shadow:0 10px 28px rgba(36,49,41,.06);
  --shadow-sm:0 4px 14px rgba(36,49,41,.05);
  --font:"Pretendard","Pretendard Variable",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Noto Sans CJK KR",system-ui,"Segoe UI",Roboto,sans-serif;
  --serif:"MaruBuri","Noto Serif KR","Noto Serif CJK KR","Nanum Myeongjo","Apple SD Gothic Neo",ui-serif,Georgia,serif;
  --jp:"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP","Noto Sans CJK JP","Noto Sans CJK KR","Hiragino Sans","Malgun Gothic",sans-serif;
  --tab-h:64px;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{
  margin:0;background:var(--cream);color:var(--ink);
  font-family:var(--font);font-size:16px;line-height:1.6;
  word-break:keep-all;overflow-wrap:break-word;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  overflow-x:hidden;
}
h1,h2,h3,h4,p,figure{margin:0}
a{color:inherit;text-decoration:none}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
img,svg{display:block;max-width:100%}
:focus-visible{outline:2px solid var(--green-2);outline-offset:3px;border-radius:6px}
::selection{background:#CFE4D6}

/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:264px minmax(0,1fr);min-height:100vh}
.content{min-width:0;display:flex;flex-direction:column}
.main{width:100%;max-width:1240px;margin:0 auto;padding:30px 34px 90px}

/* ---------- sidebar ---------- */
.sidebar{
  position:sticky;top:0;align-self:start;height:100vh;overflow-y:auto;
  background:linear-gradient(180deg,#FFFDF8 0%,#FBF8F1 100%);
  border-right:1px solid var(--line);
  padding:22px 18px 26px;display:flex;flex-direction:column;gap:6px;z-index:60;
}
.brand{display:flex;align-items:center;gap:11px;padding:6px 6px 20px}
.brand-mark{
  width:42px;height:42px;flex:0 0 42px;border-radius:14px;background:var(--green);
  display:grid;place-items:center;box-shadow:0 6px 14px rgba(27,77,62,.22);
}
.brand-text{display:flex;flex-direction:column;line-height:1.2}
.brand-text strong{font-size:18px;letter-spacing:-.02em;font-weight:800}
.brand-text small{font-size:9.5px;letter-spacing:.11em;color:var(--muted);font-weight:700;margin-top:3px}
.nav-label{font-size:11px;letter-spacing:.08em;color:var(--muted);font-weight:700;padding:6px 8px 8px}
.nav{display:flex;flex-direction:column;gap:3px}
.nav-item{
  display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:13px;
  font-size:15px;font-weight:600;color:var(--ink-2);transition:background .16s,color .16s;
}
.nav-item:hover{background:#F1EDE3}
.nav-item.is-active{background:var(--green-soft);color:var(--green);font-weight:750}
.nav-ico{display:grid;place-items:center;width:22px;height:22px;flex:0 0 22px;color:#6C7C71}
.nav-item.is-active .nav-ico{color:var(--green)}
.nav-ico svg{width:20px;height:20px}
.side-card{
  margin:22px 2px 0;padding:16px 15px;border-radius:var(--r-md);
  background:linear-gradient(150deg,#EAF3EC 0%,#F6F1E3 100%);
  border:1px solid #E2EDE4;
}
.side-card-ico{width:34px;height:34px;border-radius:11px;background:#fff;display:grid;place-items:center;margin-bottom:9px;box-shadow:var(--shadow-sm)}
.side-card-title{font-size:14px;font-weight:800;letter-spacing:-.01em}
.side-card-text{font-size:12.5px;color:#6E7B6F;margin-top:4px;line-height:1.55}
.scrim{position:fixed;inset:0;background:rgba(28,38,32,.38);opacity:0;pointer-events:none;transition:.22s;z-index:50}
.side-settings{margin-top:12px;padding:16px 4px 0;display:flex;flex-direction:column;gap:7px;border-top:1px solid var(--line-soft)}
.side-install{
  margin-top:auto;display:flex;align-items:center;justify-content:center;gap:8px;
  height:42px;border-radius:12px;border:1px solid #CFE0D3;background:#F3F9F4;
  color:var(--green);font-size:13px;font-weight:750;transition:.16s;
}
.side-install:hover{background:#EAF4EC;border-color:#B9D4C0}
.side-label{font-size:11px;letter-spacing:.06em;color:var(--muted);font-weight:700}
.voice-status{font-size:12px;color:#5D6B60;line-height:1.5}
.voice-status b{color:var(--green);font-weight:750}
.voice-status .ok{color:var(--green)}
.voice-status .no{color:#B4703C}

/* ---------- topbar ---------- */
.topbar{
  position:sticky;top:0;z-index:40;height:66px;display:flex;align-items:center;gap:14px;
  padding:0 34px;background:rgba(255,253,249,.92);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
}
.menu-btn{display:none;width:40px;height:40px;border-radius:12px;background:#F1EDE3;align-items:center;justify-content:center;color:var(--green)}
.crumb{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--muted)}
.crumb b{color:var(--ink);font-weight:700}
.crumb-sep{color:#C6BFB0}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.ghost-btn{
  display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 14px;border-radius:11px;
  border:1px solid var(--line);background:#fff;font-size:13px;font-weight:650;color:var(--ink-2);
  transition:.16s;
}
.ghost-btn:hover{border-color:#D6CEBD;background:#FEFCF7}
.install-btn{border-color:#CFE0D3;background:#F3F9F4;color:var(--green)}
.install-btn:hover{border-color:#B9D4C0;background:#EAF4EC}
.install-btn[data-state="installed"]{color:#4F7E60;background:#EFF5EE;border-color:#DDE7D8}
.top-chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:999px;background:var(--green-soft);color:var(--green);font-size:12px;font-weight:700}

/* ---------- language bar ---------- */
.langbar{
  position:sticky;top:66px;z-index:36;
  background:rgba(249,247,243,.94);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.langbar-in{max-width:1240px;margin:0 auto;padding:9px 34px;display:flex;align-items:center;gap:16px}
.lang-switch{display:inline-flex;gap:4px;padding:4px;border-radius:15px;background:#EDE7DB;border:1px solid #E7E0D2}
.lang-btn{
  display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 16px;border-radius:11px;
  font-size:14px;font-weight:750;color:#77736A;transition:.16s;white-space:nowrap;
}
.lang-btn:hover{color:var(--ink)}
.lang-btn.is-active{background:#fff;color:var(--green);box-shadow:0 3px 10px rgba(36,49,41,.12)}
.lang-flag{font-size:16px;line-height:1;filter:saturate(1.05)}
.lang-nm{letter-spacing:-.01em}
.lang-sub{font-size:10.5px;font-weight:700;color:#A29A8B;letter-spacing:.02em}
.lang-btn.is-active .lang-sub{color:#7C9C86}
.langbar-note{margin-left:auto;font-size:12.5px;color:var(--muted);font-weight:600}

/* ---------- typography bits ---------- */
.eyebrow{display:inline-block;font-size:10.5px;letter-spacing:.16em;font-weight:800;color:#9C9484;text-transform:uppercase}
.page-head{display:flex;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:22px}
.page-head h2{font-family:var(--serif);font-size:31px;letter-spacing:-.03em;font-weight:800;line-height:1.25;margin-top:4px}
.page-head p{font-size:14.5px;color:var(--muted);margin-top:6px}
.page-head .head-tools{margin-left:auto;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.section-head{display:flex;align-items:flex-end;gap:12px;margin:34px 0 14px;flex-wrap:wrap}
.section-head h3{font-size:19px;font-weight:800;letter-spacing:-.02em}
.section-head .count{font-size:12.5px;color:var(--muted);font-weight:700;background:#F1ECE2;padding:3px 9px;border-radius:999px}
.section-head .hint{margin-left:auto;font-size:13px;color:var(--muted)}

/* ---------- buttons / segmented ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;height:48px;padding:0 22px;border-radius:13px;font-size:15px;font-weight:750;transition:.16s}
.btn-primary{background:var(--green);color:#fff;box-shadow:0 8px 18px rgba(27,77,62,.2)}
.btn-primary:hover{background:#173F33;transform:translateY(-1px)}
.btn-soft{background:#fff;border:1px solid var(--line);color:var(--ink)}
.btn-soft:hover{background:#FDFBF6}
.btn-mini{height:38px;padding:0 14px;border-radius:11px;font-size:13px;font-weight:700}

.seg{display:inline-flex;background:#EFEAE0;padding:4px;border-radius:13px;gap:2px;flex-wrap:wrap}
.seg-btn{padding:9px 15px;border-radius:10px;font-size:13.5px;font-weight:700;color:#77736A;white-space:nowrap;transition:.15s}
.seg-btn:hover{color:var(--ink)}
.seg-btn.is-active{background:#fff;color:var(--green);box-shadow:0 2px 8px rgba(36,49,41,.1)}
.seg-sm .seg-btn{padding:6px 12px;font-size:12.5px;border-radius:8px}
.seg-wrap{display:flex;flex-direction:column;gap:7px}
.seg-caption{font-size:12px;color:var(--muted);font-weight:700}

.chips{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 20px}
.chip{padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:13px;font-weight:650;color:#6D6A61;transition:.15s;white-space:nowrap}
.chip:hover{border-color:#D7CFBE;background:#FDFBF6}
.chip.is-active{background:var(--green);border-color:var(--green);color:#fff;box-shadow:0 5px 12px rgba(27,77,62,.18)}

/* ---------- hero ---------- */
.hero{
  position:relative;overflow:hidden;display:grid;grid-template-columns:1.15fr .85fr;gap:18px;align-items:center;
  background:linear-gradient(115deg,#FCE7D9 0%,#FBEEDF 55%,#F7F1E2 100%);
  border-radius:var(--r-lg);padding:34px 34px 30px;border:1px solid #F4E0CF;
}
.hero::after{content:"";position:absolute;right:-70px;top:-90px;width:280px;height:280px;border-radius:50%;background:rgba(255,255,255,.35)}
.hero-copy{position:relative;z-index:2}
.hero h1{font-family:var(--serif);font-size:clamp(26px,3.2vw,40px);line-height:1.22;letter-spacing:-.035em;font-weight:800;margin:8px 0 8px}
.hero p{font-size:15px;color:#6E6558;max-width:44ch}
.hero-meta{display:flex;flex-wrap:wrap;gap:14px;margin:18px 0 22px;font-size:13px;color:#7A7266;font-weight:600}
.hero-meta span{display:inline-flex;align-items:center;gap:6px}
.hero-art{position:relative;z-index:1;display:grid;place-items:center}
.hero-art svg{width:100%;max-width:330px;height:auto}

/* ---------- quick cards ---------- */
.quick-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-top:20px}
.quick-card{
  display:flex;flex-direction:column;gap:10px;text-align:left;padding:20px;border-radius:var(--r-md);
  background:var(--paper);border:1px solid var(--line);box-shadow:var(--shadow-sm);
  transition:transform .18s,box-shadow .18s,border-color .18s;
}
.quick-card:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:#DFD7C7}
.quick-top{display:flex;align-items:center;gap:10px}
.quick-ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:0 0 40px}
.quick-ico svg{width:22px;height:22px}
.quick-card h4{font-size:16px;font-weight:800;letter-spacing:-.02em}
.quick-card p{font-size:13px;color:var(--muted);line-height:1.55}
.quick-foot{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:6px;font-size:12.5px;font-weight:700;color:var(--green)}
.quick-count{color:#9C9484;font-weight:700}

/* ---------- kana ---------- */
.kana-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(186px,1fr));gap:16px}
.kana-card{
  background:var(--paper);border:1px solid var(--line);border-radius:20px;overflow:hidden;
  box-shadow:var(--shadow-sm);display:flex;flex-direction:column;
  transition:transform .18s,box-shadow .18s;
}
.kana-card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.kana-art{position:relative;aspect-ratio:1.15/1;background:#F6F1E7;overflow:hidden}
.kana-art svg{width:100%;height:100%}
.kana-body{padding:13px 14px 15px;display:flex;flex-direction:column;gap:6px;flex:1}
.kana-line{display:flex;align-items:center;gap:9px}
.kana-char{font-family:var(--jp);font-size:30px;font-weight:600;line-height:1;color:var(--green)}
.kana-ro{font-size:12px;font-weight:750;color:#9A9384;letter-spacing:.06em;text-transform:lowercase;padding-bottom:2px}
.kana-ko{font-size:13px;font-weight:750;color:var(--ink-2)}
.kana-story{font-size:12.5px;color:#7C776C;line-height:1.5;margin-top:2px}
.kana-body .spk-row{margin-top:auto;padding-top:9px;display:flex;align-items:center;gap:8px}

/* ---------- speaker ---------- */
.spk{
  display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 13px;border-radius:999px;
  background:var(--green-soft);color:var(--green);font-size:12.5px;font-weight:750;
  border:1px solid #D6E6DA;transition:.16s;white-space:nowrap;
}
.spk:hover{background:#DBEBE0;border-color:#C6DCCD}
.spk svg{width:16px;height:16px}
.spk.is-playing{background:var(--green);color:#fff;border-color:var(--green);animation:pulse 1.1s ease-in-out infinite}
.spk.is-fallback{background:#FCEBD7;color:#9A5B1E;border-color:#F3D5B0}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(27,77,62,.35)}45%{box-shadow:0 0 0 8px rgba(27,77,62,0)}}
.spk-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* ---------- vocab ---------- */
.word-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(272px,1fr));gap:16px}
.word-card{
  background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:16px;
  box-shadow:var(--shadow-sm);display:flex;flex-direction:column;gap:11px;transition:box-shadow .18s;
}
.word-card:hover{box-shadow:var(--shadow)}
.word-top{display:flex;align-items:flex-start;gap:12px}
.word-art{width:88px;height:88px;flex:0 0 88px;border-radius:16px;overflow:hidden;background:#F7F2E8}
.word-art svg{width:100%;height:100%}
.word-headings{min-width:0;flex:1}
.word-main{font-family:var(--jp);font-size:28px;line-height:1.15;font-weight:600;color:var(--ink);word-break:keep-all;overflow-wrap:anywhere;transition:color .15s}
.word-main[data-tone="hira"]{color:#2C5B4A}
.word-main[data-tone="kata"]{color:#8A5A2B}
.word-meaning{font-size:13.5px;color:#6E6A60;margin-top:4px;font-weight:600}
.word-read{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;margin-top:5px}
.word-read .ko{background:#EFF4EC;color:#3E6B51;padding:2px 8px;border-radius:7px;font-weight:750}
.word-read .ro{color:#9A9384;font-style:italic;font-weight:600;letter-spacing:.02em}
.word-actions{display:flex;align-items:center;gap:8px;margin-top:auto;padding-top:4px;flex-wrap:wrap}
.mode-mini{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 11px;border-radius:10px;border:1px dashed #DCD3C2;background:#FCFAF4;font-size:12px;font-weight:700;color:#7E786C}
.mode-mini:hover{border-color:#C9BEA8;color:var(--ink)}
.mode-mini b{color:var(--green);font-weight:800}
.kanji-box{background:#FBF7EE;border:1px solid #EFE6D3;border-radius:14px;padding:12px 13px}
.kanji-box-top{display:flex;align-items:center;gap:10px}
.kanji-glyph{font-family:var(--jp);font-size:30px;line-height:1;color:#7A5A28;font-weight:600}
.kanji-lines{display:flex;flex-direction:column;gap:2px;font-size:12px;color:#6F6A5E}
.kanji-lines b{color:#4C463A;font-weight:750}
.kanji-tip{font-size:12px;color:#8A8172;line-height:1.5;margin-top:8px;padding-top:8px;border-top:1px dashed #E7DCC6}
.kanji-empty{font-size:12px;color:#9A9384;background:#FAF7F0;border:1px dashed #E6DFD1;border-radius:14px;padding:11px 13px;line-height:1.5}

/* ---------- sentences ---------- */
.sent-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:18px}
.sent-card{background:var(--paper);border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:var(--shadow-sm);display:flex;flex-direction:column}
.sent-art{position:relative;background:#F5EFE4;aspect-ratio:16/6.4;overflow:hidden}
.sent-art svg{width:100%;height:100%}
.sent-tag{position:absolute;left:14px;top:13px;background:rgba(255,255,255,.92);color:var(--green);padding:4px 11px;border-radius:999px;font-size:11.5px;font-weight:800;letter-spacing:.01em;box-shadow:0 3px 10px rgba(36,49,41,.08)}
.sent-body{padding:17px 19px 19px;display:flex;flex-direction:column;gap:9px;flex:1}
.sent-text{font-family:var(--jp);font-size:23px;line-height:1.6;font-weight:600;color:var(--ink);word-break:normal;line-break:strict;letter-spacing:.01em}
.sent-text[data-tone="hira"]{color:#2C5B4A}
.sent-text[data-tone="kata"]{color:#8A5A2B}
.sent-text ruby{ruby-position:over}
.sent-text rt{font-size:.42em;letter-spacing:.04em;color:#A0968A;font-weight:600}
.sent-read{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12.5px}
.sent-read .ko{background:#EFF4EC;color:#3E6B51;padding:3px 9px;border-radius:8px;font-weight:750}
.sent-read .ro{color:#9A9384;font-style:italic;font-weight:600}
.sent-meaning{font-size:14.5px;color:#514C42;font-weight:700}
.sent-tip{background:#F7F8F2;border-left:3px solid #BFD8C6;border-radius:0 12px 12px 0;padding:9px 12px;font-size:12.5px;color:#6B7468;line-height:1.6}
.sent-tip b{color:#3D6B51;font-weight:800;margin-right:4px}
.sent-actions{margin-top:auto;padding-top:6px;display:flex;gap:8px;flex-wrap:wrap}

/* ---------- english ---------- */
.en-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:16px}
.en-card{
  background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:15px 16px 14px;
  box-shadow:var(--shadow-sm);display:flex;flex-direction:column;gap:10px;position:relative;
  transition:transform .18s,box-shadow .18s,border-color .18s;
}
.en-card:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:#DFD7C7}
.en-top{display:flex;align-items:flex-start;gap:13px}
.en-art{width:102px;height:102px;flex:0 0 102px;border-radius:14px;overflow:hidden;background:#F6F1E7}
.en-art svg{width:100%;height:100%}
.en-body{padding:0;display:flex;flex-direction:column;gap:4px;flex:1;min-width:0}
.en-text{font-size:17.5px;font-weight:750;letter-spacing:-.01em;line-height:1.35;color:var(--ink);margin-top:1px}
.en-ko{font-size:13.5px;color:#6E6A60;font-weight:600}
.en-pron{font-size:12.5px;color:#9A9384;background:#FAF7F0;display:inline-block;padding:3px 9px;border-radius:8px;font-weight:600;width:fit-content}
.en-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:9px}
.en-cat{font-size:11px;font-weight:800;color:#9C9484;letter-spacing:.09em;text-transform:uppercase}
.today-en-art{width:108px;height:108px;flex:0 0 108px;border-radius:16px;overflow:hidden;background:#F7F2E8}
.today-en-art svg{width:100%;height:100%}

.dialogue{background:#FBF8F1;border:1px solid var(--line);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:12px}
.dlg-row{display:flex;gap:11px;align-items:flex-start}
.dlg-who{width:38px;height:38px;flex:0 0 38px;border-radius:12px;display:grid;place-items:center;font-size:11px;font-weight:800;color:#fff;background:var(--green)}
.dlg-row.me{flex-direction:row-reverse}
.dlg-row.me .dlg-who{background:#C97F4E}
.dlg-bubble{background:#fff;border:1px solid var(--line);border-radius:16px;padding:11px 13px;max-width:min(100%,600px);box-shadow:var(--shadow-sm)}
.dlg-row.me .dlg-bubble{background:#FDF3E9;border-color:#F3E1CD;max-width:min(100%,540px)}
.dlg-main{display:flex;gap:12px;align-items:center}
.dlg-art{width:64px;height:64px;flex:0 0 64px;border-radius:12px;overflow:hidden;background:#F7F2E8}
.dlg-art svg{width:100%;height:100%}
.dlg-text{min-width:0}
.dlg-en{font-size:15.5px;font-weight:700}
.dlg-ko{font-size:12.5px;color:#8A857A;margin-top:2px}
.dlg-pron{font-size:11.5px;color:#A29A8B;margin-top:3px}
.dlg-bubble .spk{height:30px;padding:0 10px;font-size:11.5px;margin-top:9px}

/* 상황별 회화 */
.sit-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(430px,1fr));gap:18px}
.sit-card{background:var(--paper);border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:var(--shadow-sm);display:flex;flex-direction:column}
.sit-art{position:relative;background:#F5EFE4;aspect-ratio:16/5.6;overflow:hidden}
.sit-art svg{width:100%;height:100%}
.sit-body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:11px;flex:1}
.sit-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.sit-head h3{font-size:19px;font-weight:800;letter-spacing:-.02em}
.sit-head span{font-size:12.5px;color:var(--muted);font-weight:650}
.sit-lines{display:flex;flex-direction:column;gap:8px}
.sit-line{display:flex;align-items:flex-start;gap:9px;background:#FBF9F4;border:1px solid var(--line-soft);border-radius:14px;padding:9px 11px}
.sit-line[data-who="B"]{background:#F4F8F2;border-color:#E4EDE0}
.sit-who{flex:0 0 auto;font-size:10.5px;font-weight:800;color:#6B7468;background:#EFEAE0;border-radius:999px;padding:3px 8px;margin-top:2px}
.sit-line[data-who="B"] .sit-who{background:#DFEDE2;color:#3D6B51}
.sit-line-body{flex:1;min-width:0}
.sit-en{font-size:14.5px;font-weight:700;line-height:1.4}
.sit-ko{font-size:12.5px;color:#7C776C;margin-top:1px}
.sit-pron{font-size:11.5px;color:#A29A8B;margin-top:2px}
.sit-line .spk{height:30px;padding:0 9px;font-size:11.5px;flex:0 0 auto}

/* 추천 코스 */
.course{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.course-card{
  position:relative;display:flex;align-items:center;gap:12px;text-align:left;
  background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px 16px;
  box-shadow:var(--shadow-sm);transition:.18s;
}
.course-card:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:#DFD7C7}
.course-step{
  position:absolute;top:-8px;left:14px;width:22px;height:22px;border-radius:50%;
  background:var(--green);color:#fff;font-size:11.5px;font-weight:800;display:grid;place-items:center;
  box-shadow:0 4px 10px rgba(27,77,62,.25);
}
.course-ico{width:38px;height:38px;flex:0 0 38px;border-radius:12px;display:grid;place-items:center}
.course-ico svg{width:21px;height:21px}
.course-txt{display:flex;flex-direction:column;gap:2px;min-width:0}
.course-txt strong{font-size:14.5px;font-weight:800;letter-spacing:-.01em}
.course-txt small{font-size:12px;color:var(--muted);font-weight:600}
.hero-en{background:linear-gradient(115deg,#E7EEF8 0%,#F3EEE1 55%,#FCEBDA 100%);border-color:#DCE5F0}

/* ---------- misc panels ---------- */
.panel{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:var(--shadow-sm)}
.panel-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.stat-row{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:18px}
.stat{flex:1 1 140px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow-sm)}
.stat b{display:block;font-size:23px;font-weight:800;letter-spacing:-.02em;color:var(--green)}
.stat span{font-size:12.5px;color:var(--muted);font-weight:650}
.note{display:flex;gap:10px;align-items:flex-start;background:#F4F8F2;border:1px solid #E1EBDD;border-radius:14px;padding:12px 14px;font-size:12.5px;color:#5F6E5C;line-height:1.6}
.note svg{flex:0 0 18px;margin-top:2px}

/* ---------- install modal ---------- */
body.modal-open{overflow:hidden}
.imodal{position:fixed;inset:0;z-index:300;display:flex;align-items:center;justify-content:center;padding:20px}
.imodal[hidden]{display:none}
.imodal-scrim{position:absolute;inset:0;background:rgba(24,34,28,.46);backdrop-filter:blur(3px);opacity:0;transition:opacity .2s}
.imodal.is-open .imodal-scrim{opacity:1}
.imodal-card{
  position:relative;width:min(520px,100%);max-height:min(86vh,780px);overflow-y:auto;
  background:#FFFDF9;border-radius:24px;padding:24px 24px 20px;
  box-shadow:0 30px 70px rgba(20,35,28,.32);
  transform:translateY(12px) scale(.985);opacity:0;transition:transform .22s,opacity .22s;
}
.imodal.is-open .imodal-card{transform:none;opacity:1}
.imodal-x{
  position:absolute;right:12px;top:12px;width:34px;height:34px;border-radius:50%;
  display:grid;place-items:center;color:#8A857A;background:#F3EEE4;
}
.imodal-x:hover{background:#EBE4D6;color:var(--ink)}
.imodal-head{display:flex;gap:13px;align-items:flex-start;padding-right:36px}
.imodal-ico{width:48px;height:48px;flex:0 0 48px;border-radius:14px;overflow:hidden;box-shadow:var(--shadow-sm)}
.imodal-ico svg{width:100%;height:100%}
.imodal-head h2{font-family:var(--serif);font-size:21px;font-weight:800;letter-spacing:-.02em;margin-top:2px}
.imodal-head p{font-size:13px;color:#6E6A60;line-height:1.6;margin-top:4px}
.imodal-body{margin-top:16px;display:flex;flex-direction:column;gap:12px}
.imodal-sub{font-size:12.5px;color:#7C776C;line-height:1.6}
.imodal-done{font-size:13px;background:#EAF4EC;border:1px solid #D3E6D8;color:#2F6B4F;border-radius:12px;padding:10px 12px;line-height:1.55}
.imodal-install{width:100%;height:50px;font-size:15.5px}
.imodal-plat{border:1px solid var(--line);border-radius:16px;padding:13px 14px;background:#fff}
.imodal-plat.is-here{border-color:#BFD8C6;background:#F6FAF6;box-shadow:0 0 0 3px rgba(127,179,146,.14)}
.imodal-plat-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.imodal-plat-head h3{font-size:14px;font-weight:800;letter-spacing:-.01em}
.plat-flag{font-size:16px;line-height:1}
.plat-now{font-size:10.5px;font-weight:800;color:#fff;background:#4F8A66;border-radius:999px;padding:3px 8px}
.steps{list-style:none;counter-reset:s;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:7px}
.steps li{counter-increment:s;position:relative;padding-left:26px;font-size:12.5px;color:#5F5B52;line-height:1.55}
.steps li::before{
  content:counter(s);position:absolute;left:0;top:1px;width:18px;height:18px;border-radius:50%;
  background:#EFEAE0;color:#6E6A60;font-size:10.5px;font-weight:800;display:grid;place-items:center;
}
.steps b{color:var(--ink);font-weight:800}
.plat-tip{font-size:11.5px;color:#9A7A4E;background:#FDF6E9;border-radius:9px;padding:7px 9px;margin-top:9px;line-height:1.5}
.imodal-foot{font-size:11.5px;color:#9C9484;text-align:center;margin-top:2px}

/* ---------- toast ---------- */
.toast{
  position:fixed;left:50%;bottom:26px;transform:translate(-50%,16px);z-index:400;
  background:rgba(30,50,40,.95);color:#fff;font-size:13.5px;font-weight:600;
  padding:12px 18px;border-radius:13px;box-shadow:0 12px 30px rgba(20,35,28,.28);
  opacity:0;pointer-events:none;transition:.22s;max-width:min(92vw,520px);text-align:center;line-height:1.5;
}
.toast.is-on{opacity:1;transform:translate(-50%,0)}

/* ---------- tabbar (mobile) ---------- */
.tabbar{display:none}

/* ---------- responsive ---------- */
@media (max-width:1080px){
  .hero{grid-template-columns:1fr;padding:28px}
  .hero-art{order:-1;max-width:260px;margin:0 auto}
  .sent-list{grid-template-columns:1fr}
}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .sidebar{
    position:fixed;left:0;top:0;bottom:0;width:min(84vw,320px);height:100dvh;
    transform:translateX(-102%);transition:transform .25s ease;box-shadow:0 20px 60px rgba(20,35,28,.2);
    padding-top:calc(20px + env(safe-area-inset-top));
  }
  body.menu-open .sidebar{transform:none}
  body.menu-open .scrim{opacity:1;pointer-events:auto}
  .menu-btn{display:inline-flex}
  .topbar{padding:0 16px;height:60px;padding-top:env(safe-area-inset-top)}
  .langbar{top:60px}
  .langbar-in{padding:8px 16px;gap:10px}
  .lang-switch{width:100%}
  .lang-btn{flex:1;justify-content:center;height:36px;padding:0 10px;font-size:13.5px}
  .lang-sub{display:none}
  .langbar-note{display:none}
  .crumb span:first-child,.crumb-sep{display:none}
  .crumb{font-size:13px}
  .ghost-btn span{display:none}
  .ghost-btn{width:38px;padding:0;justify-content:center}
  .top-chip{display:none}
  .main{padding:18px 16px calc(var(--tab-h) + 46px + env(safe-area-inset-bottom))}
  .chips{flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;margin:12px -16px 16px;padding:0 16px 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto}
  .hide-sm{display:none !important}
  .stat{flex:1 1 44%;padding:12px 13px}
  .stat b{font-size:20px}
  .stat span{font-size:11.5px;line-height:1.45}
  .hero{padding:20px 18px 20px}
  .hero-art{max-width:180px;margin-top:-4px}
  .hero-meta{gap:9px 12px;font-size:12px;margin:14px 0 18px}
  .hero p{font-size:14.5px}
  .page-head p{font-size:13.5px}
  .word-grid{gap:12px}
  .en-actions .spk{height:34px}
  .page-head h2{font-size:25px}
  .page-head .head-tools{width:100%;margin-left:0}
  .seg{width:100%;justify-content:space-between}
  .seg-btn{flex:1;text-align:center;padding:9px 8px;font-size:12.5px}
  .tabbar{
    display:flex;position:fixed;left:0;right:0;bottom:0;z-index:70;
    height:calc(var(--tab-h) + env(safe-area-inset-bottom));
    padding-bottom:env(safe-area-inset-bottom);
    background:rgba(255,253,249,.97);backdrop-filter:blur(14px);border-top:1px solid var(--line);
  }
  .tab-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;font-weight:700;color:#8D887C}
  .tab-item.is-active{color:var(--green)}
  .tab-ico svg{width:21px;height:21px}
  .kana-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
  .sit-grid{grid-template-columns:1fr}
  .sit-line{flex-wrap:wrap}
  .sit-line .spk{margin-left:auto}
  .en-art{width:88px;height:88px;flex-basis:88px}
  .course{grid-template-columns:1fr;gap:12px}
  .imodal{padding:12px}
  .imodal-card{padding:20px 18px 18px;border-radius:20px;max-height:88vh}
  .dlg-art{width:54px;height:54px;flex-basis:54px}
  .today-en-art{width:84px;height:84px;flex-basis:84px}
  .kana-char{font-size:26px}
  .word-grid{grid-template-columns:1fr}
  .en-grid{grid-template-columns:1fr}
  .hero h1{font-size:27px}
  .hero-art{max-width:210px}
  .sent-text{font-size:21px}
  .toast{bottom:calc(var(--tab-h) + 18px + env(safe-area-inset-bottom))}
}
@media (max-width:520px){
  .kana-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
  .kana-body{padding:11px 11px 13px}
  .kana-story{font-size:11.5px}
  .kana-char{font-size:24px}
  .word-art{width:76px;height:76px;flex-basis:76px}
  .word-main{font-size:25px}
  .hero{padding:20px 18px 18px;border-radius:20px}
  .hero-art{max-width:160px}
  .hero h1{font-size:25px}
  .hero-meta{gap:10px;font-size:12px}

  .quick-grid{gap:12px}
  .quick-card{padding:16px}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms !important;transition-duration:.001ms !important}
}

  function viewKana() {

    var list = isHira ? KANA_HIRA : KANA_KATA;
    var rows = [];
    list.forEach(function (k) { if (rows.indexOf(k.row) === -1) rows.push(k.row); });
    var shown = list.filter(function (k) { return state.kanaRow === 'all' || k.row === state.kanaRow; });

    var rowChips = '<button type="button" class="chip' + (state.kanaRow === 'all' ? ' is-active' : '') + '" data-act="kana-row" data-row="all">전체 ' + list.length + '</button>' +
      rows.map(function (r) {
        return '<button type="button" class="chip' + (state.kanaRow === r ? ' is-active' : '') + '" data-act="kana-row" data-row="' + esc(r) + '">' + esc(r) + '</button>';
      }).join('');

    var cards = shown.map(function (k, i) {
      var idx = list.indexOf(k);
      return '<article class="kana-card">' +
        '<div class="kana-art">' + kanaSVG(k.ch, k.art, idx) + '</div>' +
        '<div class="kana-body">' +
        '<div class="kana-line"><span class="kana-char">' + esc(k.ch) + '</span><span class="kana-ro">' + esc(k.ro) + '</span></div>' +
        '<div class="kana-ko">' + esc(k.ko) + ' 소리</div>' +
        '<p class="kana-story">' + esc(k.story) + '</p>' +
        '<div class="spk-row">' + spkBtn(k.ch, 'ja', 1, '듣기') + '</div>' +
        '</div></article>';
    }).join('');

    return '' +
      '<div class="page-head">' +
      '<div><span class="eyebrow">STEP 1 · かな</span><h2>일본어 첫 수업</h2><p>' + esc(SUBTITLES.kana) + '</p></div>' +
      '<div class="head-tools">' +
      '<div class="seg" role="group" aria-label="가나 종류">' +
      '<button type="button" class="seg-btn' + (isHira ? ' is-active' : '') + '" data-act="kana-script" data-script="hiragana">히라가나 ' + KANA_HIRA.length + '자</button>' +
      '<button type="button" class="seg-btn' + (!isHira ? ' is-active' : '') + '" data-act="kana-script" data-script="katakana">가타카나 ' + KANA_KATA.length + '자</button>' +
      '</div></div></div>' +
      '<div class="chips">' + rowChips + '</div>' +
      '<div class="kana-grid">' + cards + '</div>' +
      '<div class="note" style="margin-top:22px">' + ICONS.info +
      '<div>그림 속 글자 모양을 손가락으로 따라 그려 보세요. 카드의 <b>듣기</b>를 누르면 실제 일본어 발음이 나옵니다. 소리가 안 나면 자동으로 온라인 음성으로 넘어가요.</div></div>';
  }

  /* ---------------- vocab ---------------- */
  var CATS = [{ k: 'all', label: '전체' }, { k: 'noun', label: '주어·명사' }, { k: 'verb', label: '동사' }, { k: 'adj', label: '형용사' }];
  var MODES = [{ k: 'orig', label: '원래대로' }, { k: 'hira', label: '히라가나' }, { k: 'kata', label: '가타카나' }];

  function wordForm(w, mode) {
    if (mode === 'hira') return w.reading;
    if (mode === 'kata') return toKata(w.reading);
    return w.orig;
  }
  function modeLabel(mode) {
    return mode === 'hira' ? '히라가나' : mode === 'kata' ? '가타카나' : '원래대로';
  }

  function viewVocab() {
    var list = WORDS.filter(function (w) { return state.vocabCat === 'all' || w.cat === state.vocabCat; });
    var chips = CATS.map(function (c) {
      var n = c.k === 'all' ? WORDS.length : WORDS.filter(function (w) { return w.cat === c.k; }).length;
      return '<button type="button" class="chip' + (state.vocabCat === c.k ? ' is-active' : '') + '" data-act="vocab-cat" data-cat="' + c.k + '">' + c.label + ' <span style="opacity:.65">' + n + '</span></button>';
    }).join('');

    var segs = MODES.map(function (m) {
      return '<button type="button" class="seg-btn' + (state.vocabMode === m.k ? ' is-active' : '') + '" data-act="v-mode" data-mode="' + m.k + '">' + m.label + '</button>';
    }).join('');

    var cards = list.map(function (w) {
      var mode = state.cardModes[w.id] || state.vocabMode;
      var form = wordForm(w, mode);
      var kanji = w.kanji
        ? '<div class="kanji-box">' +
        '<div class="kanji-box-top"><span class="kanji-glyph">' + esc(w.kanji.chars) + '</span>' +
        '<span class="kanji-lines"><span>훈 <b>' + esc(w.kanji.hun) + '</b></span><span>음독 <b>' + esc(w.kanji.on || '—') + '</b> · 훈독 <b>' + esc(w.kanji.kun || '—') + '</b></span></span></div>' +
        '<p class="kanji-tip">' + esc(w.kanji.tip) + '</p></div>'
        : '<div class="kanji-empty">한자 없이 쓰는 말이에요 · ' + esc(w.reading) + ' (' + esc(w.romaji) + ')</div>';

      return '<article class="word-card">' +
        '<div class="word-top">' +
        '<div class="word-art">' + iconSVG(w.art, w.bg) + '</div>' +
        '<div class="word-headings">' +
        '<div class="word-main" data-tone="' + mode + '">' + esc(form) + '</div>' +
        '<div class="word-meaning">' + esc(w.mean) + '</div>' +
        '<div class="word-read"><span class="ko">' + esc(w.ko) + '</span><span class="ro">' + esc(w.romaji) + '</span></div>' +
        '</div></div>' +
        kanji +
        '<div class="word-actions">' + spkBtn(form, 'ja', 1, '듣기') +
        '<button type="button" class="mode-mini" data-act="card-mode" data-id="' + esc(w.id) + '" title="이 카드만 표기 바꾸기">표기 <b>' + modeLabel(mode) + '</b> ⇄</button>' +
        '</div>' +
        '</article>';
    }).join('');

    var note = state.vocabMode !== 'orig'
      ? '<div class="note" style="margin-bottom:16px">' + ICONS.info + '<div>지금은 <b>' + modeLabel(state.vocabMode) + ' 표기</b>로 보고 있어요. 카드마다 <b>표기 ⇄</b> 버튼으로 하나씩만 바꿀 수도 있습니다.</div></div>'
      : '';

    return '' +
      '<div class="page-head">' +
      '<div><span class="eyebrow">STEP 2 · 単語</span><h2>필수 단어장</h2><p>' + esc(SUBTITLES.vocab) + '</p></div>' +
      '</div>' +
      '<div class="chips">' + chips + '</div>' +
      '<div style="display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-bottom:14px">' +
      '<div class="seg-wrap"><span class="seg-caption">전체 표기 한 번에 바꾸기</span>' +
      '<div class="seg" role="group" aria-label="표기 전환">' + segs + '</div></div>' +
      '</div>' + note +
      '<div class="word-grid">' + cards + '</div>' +
      '<div class="note" style="margin-top:22px">' + ICONS.info +
      '<div>발음은 <b>한국어 표기</b>와 <b>로마자</b>로 항상 함께 보여요. 히라가나·가타카나로 바꿔도 읽는 법은 그대로 확인할 수 있습니다.</div></div>';
  }

  /* ---------------- sentences ---------------- */
  var SITUATIONS = ['전체', '인사', '카페', '식당', '길찾기', '쇼핑', '호텔', '교통', '일상'];
  var SENT_MODES = [{ k: 'orig', label: '원래대로' }, { k: 'hira', label: '히라가나' }, { k: 'kata', label: '가타카나' }, { k: 'furi', label: '한자+후리가나' }];

  function furiHTML(s) {
    var out = '';
    var re = /\[([^\]|]+)\|([^\]]+)\]/g;
    var last = 0, m;
    while ((m = re.exec(s))) {
      out += esc(s.slice(last, m.index));
      out += '<ruby>' + esc(m[1]) + '<rt>' + esc(m[2]) + '</rt></ruby>';
      last = m.index + m[0].length;
    }
    out += esc(s.slice(last));
    return out;
  }

  function sentDisplay(s, mode) {
    if (mode === 'hira') return { html: esc(s.kana), tone: 'hira' };
    if (mode === 'kata') return { html: esc(toKata(s.kana)), tone: 'kata' };
    if (mode === 'furi') return { html: furiHTML(s.furi), tone: 'orig' };
    return { html: esc(s.orig), tone: 'orig' };
  }

  function viewSentences() {
    var list = SENTENCES.filter(function (s) { return state.sentCat === '전체' || s.cat === state.sentCat; });
    var chips = SITUATIONS.map(function (c) {
      var n = c === '전체' ? SENTENCES.length : SENTENCES.filter(function (s) { return s.cat === c; }).length;
      if (!n) return '';
      return '<button type="button" class="chip' + (state.sentCat === c ? ' is-active' : '') + '" data-act="sent-cat" data-cat="' + esc(c) + '">' + esc(c) + ' <span style="opacity:.65">' + n + '</span></button>';
    }).join('');

    var segs = SENT_MODES.map(function (m) {
      return '<button type="button" class="seg-btn' + (state.sentMode === m.k ? ' is-active' : '') + '" data-act="s-mode" data-mode="' + m.k + '">' + m.label + '</button>';
    }).join('');

    var cards = list.map(function (s) {
      var d = sentDisplay(s, state.sentMode);
      return '<article class="sent-card">' +
        '<div class="sent-art">' + sceneSVG(s.art, s.bg) + '<span class="sent-tag">' + esc(s.cat) + '</span></div>' +
        '<div class="sent-body">' +
        '<p class="sent-text" data-tone="' + d.tone + '">' + d.html + '</p>' +
        '<div class="sent-read"><span class="ko">' + esc(s.koPron) + '</span><span class="ro">' + esc(s.romaji) + '</span></div>' +
        '<p class="sent-meaning">' + esc(s.meaning) + '</p>' +
        '<div class="sent-tip"><b>포인트</b>' + esc(s.tip) + '</div>' +
        '<div class="sent-actions">' + spkBtn(s.orig, 'ja', 1, '보통') + spkBtn(s.orig, 'ja', 0.85, '천천히') + '</div>' +
        '</div></article>';
    }).join('');

    return '' +
      '<div class="page-head">' +
      '<div><span class="eyebrow">STEP 3 · 会話</span><h2>자주 쓰는 문장</h2><p>' + esc(SUBTITLES.sentences) + '</p></div>' +
      '<div class="head-tools"><div class="seg" role="group" aria-label="문장 표기">' + segs + '</div></div>' +
      '</div>' +
      '<div class="chips">' + chips + '</div>' +
      '<div class="sent-list">' + cards + '</div>' +
      '<div class="note" style="margin-top:22px">' + ICONS.info +
      '<div><b>한자+후리가나</b>는 한자 위에 읽는 법이 작게 붙어요. <b>히라가나</b>·<b>가타카나</b>로 바꿔 읽는 연습을 하고, 마지막엔 <b>원래대로</b> 한자를 확인해 보세요.</div></div>';
  }

  /* ---------------- english · 한마디 ---------------- */
  var EN_CATS = (function () {
    var out = ['전체'];
    ENGLISH.forEach(function (p) { if (out.indexOf(p.cat) === -1) out.push(p.cat); });
    return out;
  })();

  function enCard(p) {
    return '<article class="en-card" data-lang="en" data-cat="' + esc(p.cat) + '">' +
      '<div class="en-top">' +
      '<div class="en-art" style="background:' + p.bg + '">' + enArtSVG(EN_ART[p.art], p.bg) + '</div>' +
      '<div class="en-body">' +
      '<span class="en-cat">' + esc(p.cat) + ' · ' + esc(p.tag) + '</span>' +
      '<p class="en-text">' + esc(p.en) + '</p>' +
      '<p class="en-ko">' + esc(p.ko) + '</p>' +
      '<p class="en-pron">[' + esc(p.pron) + ']</p>' +
      '<div class="en-actions">' + spkBtn(p.en, 'en', 1, '보통') + spkBtn(p.en, 'en', 0.85, '천천히') + '</div>' +
      '</div></div></article>';
  }

  function viewEnglish() {
    var active = EN_CATS.indexOf(state.enCat) === -1 ? '전체' : state.enCat;
    var list = ENGLISH.filter(function (p) { return active === '전체' || p.cat === active; });

    var chips = EN_CATS.map(function (c) {
      var n = c === '전체' ? ENGLISH.length : ENGLISH.filter(function (p) { return p.cat === c; }).length;
      return '<button type="button" class="chip' + (active === c ? ' is-active' : '') + '" data-act="en-cat" data-cat="' + esc(c) + '">' + esc(c) + ' <span style="opacity:.65">' + n + '</span></button>';
    }).join('');

    var body;
    if (active === '전체') {
      body = EN_CATS.slice(1).map(function (c) {
        var items = list.filter(function (p) { return p.cat === c; });
        if (!items.length) return '';
        return '<div class="section-head"><h3>' + esc(c) + '</h3><span class="count">' + items.length + '마디</span></div>' +
          '<div class="en-grid">' + items.map(enCard).join('') + '</div>';
      }).join('');
    } else {
      body = '<div class="en-grid">' + list.map(enCard).join('') + '</div>';
    }

    return '' +
      '<div class="page-head">' +
      '<div><span class="eyebrow">ENGLISH · 한마디</span><h2>영어 한마디</h2><p>' + esc(SUBTITLES.english) + '</p></div>' +
      '</div>' +
      '<div class="chips">' + chips + '</div>' +
      body +
      '<div class="note" style="margin-top:24px">' + ICONS.info +
      '<div>그림을 먼저 보고 영어를 읽으면 뜻이 오래 남아요. 영어는 <b>보통(1.0x)</b>과 <b>천천히(0.85x)</b>로 들을 수 있고, 소리가 안 나면 온라인 음성으로 자동 전환됩니다.</div></div>';
  }

  /* ---------------- english · 상황 회화 ---------------- */
  function sitLine(l) {
    return '<div class="sit-line" data-who="' + esc(l.who) + '">' +
      '<span class="sit-who">' + (l.who === 'A' ? '상대' : '나') + '</span>' +
      '<div class="sit-line-body">' +
      '<p class="sit-en">' + esc(l.en) + '</p>' +
      '<p class="sit-ko">' + esc(l.ko) + '</p>' +
      (l.pron ? '<p class="sit-pron">[' + esc(l.pron) + ']</p>' : '') +
      '</div>' +
      spkBtn(l.en, 'en', 0.95, '듣기') +
      '</div>';
  }

  function viewEnSituations() {
    var cards = EN_SITUATIONS.map(function (s) {
      return '<article class="sit-card">' +
        '<div class="sit-art">' + enScene(s.bg, s.art) + '<span class="sent-tag">' + esc(s.label) + '</span></div>' +
        '<div class="sit-body">' +
        '<div class="sit-head"><h3>' + esc(s.label) + '</h3><span>' + esc(s.sub) + '</span></div>' +
        '<div class="sit-lines">' + s.lines.map(sitLine).join('') + '</div>' +
        '<div class="sent-tip"><b>포인트</b>' + esc(s.tip) + '</div>' +
        '</div></article>';
    }).join('');

    return '' +
      '<div class="page-head">' +
      '<div><span class="eyebrow">ENGLISH · 会話</span><h2>여행 영어 회화</h2><p>' + esc(SUBTITLES['en-situations']) + '</p></div>' +
      '</div>' +
      '<div class="sit-grid">' + cards + '</div>' +
      '<div class="note" style="margin-top:24px">' + ICONS.info +
      '<div><b>상대</b>의 말을 먼저 듣고, <b>나</b>의 대답을 따라 말해 보세요. 한 줄씩 번갈아 소리 내면 실제 대화처럼 익혀집니다.</div></div>';
  }

  /* ---------------- english · 카페 대화 ---------------- */
  function viewEnCafe() {
    var rows = DIALOGUE.map(function (d) {
      var me = d.who === 'me';
      return '<div class="dlg-row' + (me ? ' me' : '') + '">' +
        '<span class="dlg-who">' + (me ? '나' : 'Mia') + '</span>' +
        '<div class="dlg-bubble">' +
        '<div class="dlg-main">' +
        '<div class="dlg-art">' + iconSVG(EN_ART[d.art], d.bg) + '</div>' +
        '<div class="dlg-text">' +
        '<p class="dlg-en">' + esc(d.en) + '</p>' +
        '<p class="dlg-ko">' + esc(d.ko) + '</p>' +
        (d.pron ? '<p class="dlg-pron">[' + esc(d.pron) + ']</p>' : '') +
        '</div></div>' +
        spkBtn(d.en, 'en', 0.95, '듣기') +
        '</div></div>';
    }).join('');

    return '' +
      '<div class="page-head">' +
      '<div><span class="eyebrow">ENGLISH · CAFE</span><h2>카페 주문 대화</h2><p>' + esc(SUBTITLES['en-cafe']) + '</p></div>' +
      '</div>' +
      '<div class="panel cafe-panel">' +
      '<div class="section-head" style="margin:0 0 14px"><h3>주문하고 받기</h3><span class="count">' + DIALOGUE.length + '마디</span><span class="hint">Mia의 말 다음에 내 대답을 따라 해 보세요</span></div>' +
      '<div class="dialogue">' + rows + '</div>' +
      '</div>' +
      '<div class="section-head"><h3>이 대화에서 바로 쓰는 한마디</h3><span class="hint">그림을 보고 떠올려 보세요</span></div>' +
      '<div class="en-grid">' + ENGLISH.filter(function (p) { return p.cat === '카페'; }).map(enCard).join('') + '</div>' +
      '<div class="note" style="margin-top:24px">' + ICONS.info +
      '<div>처음에는 <b>Mia</b>의 말만 듣고, 다음에는 <b>나</b>의 대답을 소리 내어 따라 해 보세요. “For here or to go?”는 카페에서 가장 자주 듣는 질문이에요.</div></div>';
  }

  var VIEWS = {
    home: viewHome, kana: viewKana, vocab: viewVocab, sentences: viewSentences,
    english: viewEnglish, 'en-situations': viewEnSituations, 'en-cafe': viewEnCafe
  };

  /* ============================================================
     Render + routing + chrome (nav / language bar)
     ============================================================ */
  function renderChrome() {
    var nav = NAV[state.lang] || NAV.ja;
    var navHost = document.getElementById('nav');
    if (navHost) {
      navHost.innerHTML = nav.map(function (n) {
        return '<a href="#' + n.view + '" class="nav-item" data-act="nav" data-view="' + n.view + '">' +
          '<span class="nav-ico" aria-hidden="true">' + (ICONS[n.ico] || '') + '</span>' + n.label + '</a>';
      }).join('');
    }
    var tabHost = document.getElementById('tabbar');
    if (tabHost) {
      tabHost.innerHTML = nav.map(function (n) {
        return '<a href="#' + n.view + '" class="tab-item" data-act="nav" data-view="' + n.view + '">' +
          '<span class="tab-ico" aria-hidden="true">' + (ICONS[n.ico] || '') + '</span><span>' + n.tab + '</span></a>';
      }).join('');
    }
    $$('.lang-btn').forEach(function (b) {
      var on = b.getAttribute('data-lang') === state.lang;
      b.classList.toggle('is-active', on);
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
    var cfg = LANGS[state.lang] || LANGS.ja;
    var note = document.getElementById('langNote');
    if (note) note.textContent = cfg.note;
    var lbl = document.getElementById('navLabel');
    if (lbl) lbl.textContent = cfg.navLabel;
    document.body.setAttribute('data-lang', state.lang);
  }

  function render() {
    var view = VIEWS[state.view] ? state.view : 'home';
    var host = document.getElementById('view');
    if (!host) return;
    renderChrome();
    host.innerHTML = VIEWS[view]();
    var crumb = document.getElementById('crumbNow');
    if (crumb) crumb.textContent = TITLES[view];
    $$('[data-view]').forEach(function (el) {
      var on = el.getAttribute('data-view') === view;
      el.classList.toggle('is-active', on);
      if (on) el.setAttribute('aria-current', 'page'); else el.removeAttribute('aria-current');
    });
    syncRateButtons();
    Speech.updateStatus();
  }

  function syncRateButtons() {
    $$('[data-rate-btn]').forEach(function (b) {
      b.classList.toggle('is-active', Number(b.getAttribute('data-rate')) === Number(state.rate));
    });
  }

  function setHash(view) {
    if (location.hash !== '#' + view) {
      try { history.replaceState(null, '', '#' + view); } catch (e) { location.hash = view; }
    }
  }

  function go(view) {
    if (!VIEWS[view]) view = 'home';
    if (LANGS[state.lang].views.indexOf(view) === -1) {
      state.lang = LANGS.en.views.indexOf(view) !== -1 ? 'en' : 'ja';
    }
    var changed = state.view !== view;
    state.view = view;
    save();
    setHash(view);
    render();
    if (changed) window.scrollTo({ top: 0, behavior: 'auto' });
    document.body.classList.remove('menu-open');
  }

  function setLang(lang) {
    if (!LANGS[lang] || state.lang === lang) return;
    state.lang = lang;
    if (LANGS[lang].views.indexOf(state.view) === -1) state.view = 'home';
    save();
    setHash(state.view);
    render();
    window.scrollTo({ top: 0, behavior: 'auto' });
    document.body.classList.remove('menu-open');
    toast(lang === 'en' ? '영어 학습으로 바꿨어요 · 영어 한마디부터' : '일본어 학습으로 바꿨어요 · 가나부터', 1900);
  }

  /* ============================================================
     홈 화면에 추가 (PWA install)
     ============================================================ */
  var Install = (function () {
    var deferred = null;
    var lastOutcome = '';

    function isStandalone() {
      try {
        if (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) return true;
        if (window.matchMedia && window.matchMedia('(display-mode: minimal-ui)').matches) return true;
      } catch (e) { }
      return window.navigator.standalone === true;
    }
    function platform() {
      var ua = navigator.userAgent || '';
      var iOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      return iOS ? 'ios' : (/Android/.test(ua) ? 'android' : 'other');
    }

    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      deferred = e;
      paintIfOpen();
    });
    window.addEventListener('appinstalled', function () {
      deferred = null;
      lastOutcome = 'installed';
      paintIfOpen();
      toast('홈 화면에 추가됐어요! 아이콘을 눌러 바로 열 수 있어요', 3400);
    });

    function steps(list) {
      return '<ol class="steps">' + list.map(function (t) { return '<li>' + t + '</li>'; }).join('') + '</ol>';
    }

    function bodyHTML() {
      var here = platform();
      var html = '';
      if (isStandalone()) {
        html += '<p class="imodal-done">이미 <b>앱처럼 열린 화면</b>이에요. 홈 화면 아이콘을 눌러 바로 시작할 수 있어요.</p>';
      }
      if (deferred) {
        html += '<button type="button" class="btn btn-primary imodal-install" data-act="do-install">지금 바로 설치하기</button>' +
          '<p class="imodal-sub">버튼을 누르면 설치 창이 떠요. 한 번만 누르면 끝나요.</p>';
      } else if (lastOutcome === 'installed') {
        html += '<p class="imodal-done">설치가 끝났어요. 홈 화면에서 <b>한마디 여행</b> 아이콘을 찾아보세요.</p>';
      } else if (lastOutcome === 'accepted') {
        html += '<p class="imodal-done">설치를 진행 중이에요. 잠시 뒤 홈 화면에서 <b>한마디 여행</b> 아이콘을 확인해 보세요.</p>';
      } else if (lastOutcome === 'dismissed') {
        html += '<p class="imodal-sub">설치를 취소했어요. 아래 방법으로도 홈 화면에 추가할 수 있어요.</p>';
      } else {
        html += '<p class="imodal-sub">아래 방법으로 홈 화면에 아이콘을 만들 수 있어요. (설치 창이 뜨지 않는 브라우저예요)</p>';
      }

      html += '<div class="imodal-plat' + (here === 'android' ? ' is-here' : '') + '">' +
        '<div class="imodal-plat-head"><span class="plat-flag" aria-hidden="true">🤖</span><h3>안드로이드 · 크롬</h3>' + (here === 'android' ? '<span class="plat-now">지금 이 기기</span>' : '') + '</div>' +
        steps([
          '크롬 오른쪽 위 <b>⋮</b> 메뉴를 눌러요.',
          '<b>앱 설치</b> 또는 <b>홈 화면에 추가</b>를 골라요.',
          '<b>설치</b>를 누르면 바탕화면에 아이콘이 생겨요.'
        ]) + '</div>';

      html += '<div class="imodal-plat' + (here === 'ios' ? ' is-here' : '') + '">' +
        '<div class="imodal-plat-head"><span class="plat-flag" aria-hidden="true">🍎</span><h3>아이폰 · 아이패드 · 사파리</h3>' + (here === 'ios' ? '<span class="plat-now">지금 이 기기</span>' : '') + '</div>' +
        steps([
          '<b>사파리</b>로 이 페이지를 열고 아래 <b>공유</b> 버튼(⬆️)을 눌러요.',
          '목록에서 <b>홈 화면에 추가</b>를 골라요.',
          '오른쪽 위 <b>추가</b>를 누르면 아이콘이 생겨요.'
        ]) +
        '<p class="plat-tip">카카오톡·인스타그램 안의 브라우저에서는 안 돼요. 꼭 사파리로 열어 주세요.</p></div>';

      html += '<p class="imodal-foot">아이콘을 한 번 만들면 주소를 입력하지 않고 앱처럼 열 수 있어요.</p>';
      return html;
    }

    function paint() {
      var body = document.getElementById('installBody');
      if (body) body.innerHTML = bodyHTML();
    }
    function paintIfOpen() {
      var m = document.getElementById('installModal');
      if (m && !m.hidden) paint();
    }
    function open() {
      var m = document.getElementById('installModal');
      if (!m) return;
      lastOutcome = '';
      paint();
      m.hidden = false;
      requestAnimationFrame(function () { m.classList.add('is-open'); });
      document.body.classList.add('modal-open');
      var first = m.querySelector('[data-act="do-install"]') || m.querySelector('[data-act="close-install"]');
      if (first) { try { first.focus(); } catch (e) { } }
      updateUi();
    }
    function close() {
      var m = document.getElementById('installModal');
      if (!m) return;
      m.classList.remove('is-open');
      document.body.classList.remove('modal-open');
      setTimeout(function () { if (!m.classList.contains('is-open')) m.hidden = true; }, 180);
    }
    function updateUi() {
      var btns = $$('[data-act="install"]');
      btns.forEach(function (b) {
        if (isStandalone()) b.setAttribute('data-state', 'installed');
      });
    }
    function promptNow() {
      if (!deferred) return false;
      var ev = deferred;
      deferred = null;
      try {
        ev.prompt();
        ev.userChoice.then(function (choice) {
          lastOutcome = (choice && choice.outcome) || 'dismissed';
          paintIfOpen();
          if (lastOutcome === 'accepted') toast('설치를 시작했어요', 2200);
          else toast('설치를 취소했어요 · 나중에 다시 추가할 수 있어요', 2600);
        }).catch(function () { paintIfOpen(); });
      } catch (e) {
        paintIfOpen();
        return false;
      }
      setTimeout(paintIfOpen, 400);
      return true;
    }
    function start() {
      if (isStandalone()) { toast('이미 홈 화면 앱처럼 열려 있어요', 2400); return; }
      open();
      if (deferred) promptNow();
    }

    return { start: start, open: open, close: close, prompt: promptNow, isStandalone: isStandalone, hasPrompt: function () { return !!deferred; } };
  })();

  /* ============================================================
     Events (speech is invoked directly in the click task)
     ============================================================ */
  document.addEventListener('click', function (e) {
    var el = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!el) return;
    var act = el.getAttribute('data-act');

    if (act === 'nav' || act === 'go') {
      e.preventDefault();
      go(el.getAttribute('data-view'));
      return;
    }
    if (act === 'lang') {
      e.preventDefault();
      setLang(el.getAttribute('data-lang'));
      return;
    }
    if (act === 'install') { e.preventDefault(); Install.start(); return; }
    if (act === 'do-install') { e.preventDefault(); Install.prompt(); return; }
    if (act === 'close-install') { e.preventDefault(); Install.close(); return; }
    if (act === 'open-menu') { document.body.classList.add('menu-open'); return; }
    if (act === 'close-menu') { document.body.classList.remove('menu-open'); return; }
    if (act === 'rate') {
      state.rate = Number(el.getAttribute('data-rate')) || 1;
      save(); syncRateButtons();
      toast(state.rate < 1 ? '발음 속도를 천천히(0.85x)로 바꿨어요' : '발음 속도를 보통(1.0x)으로 바꿨어요', 1800);
      return;
    }
    if (act === 'test-voice' || act === 'test-voice-en') {
      var lang = act === 'test-voice' ? 'ja' : 'en';
      var name = Speech.voiceName(lang);
      Speech.speak(lang === 'ja' ? 'こんにちは、はじめまして' : 'Hello, nice to meet you.', lang, 1, null);
      toast(name ? (lang === 'ja' ? '일본어 음성: ' : '영어 음성: ') + name : '기기 음성이 없어 온라인 음성으로 재생합니다');
      return;
    }
    if (act === 'speak') {
      e.preventDefault();
      Speech.speak(el.getAttribute('data-text'), el.getAttribute('data-lang'), Number(el.getAttribute('data-rate')) || 1, el);
      return;
    }
    if (act === 'kana-script') {
      state.kanaScript = el.getAttribute('data-script');
      state.kanaRow = 'all';
      save(); go('kana');
      return;
    }
    if (act === 'kana-row') { state.kanaRow = el.getAttribute('data-row'); save(); render(); return; }
    if (act === 'vocab-cat') { state.vocabCat = el.getAttribute('data-cat'); save(); render(); return; }
    if (act === 'v-mode') {
      state.vocabMode = el.getAttribute('data-mode');
      state.cardModes = {};
      save(); render();
      return;
    }
    if (act === 'card-mode') {
      var id = el.getAttribute('data-id');
      var cur = state.cardModes[id] || state.vocabMode;
      var order = ['orig', 'hira', 'kata'];
      var nx = order[(order.indexOf(cur) + 1) % order.length];
      state.cardModes[id] = nx;
      save(); render();
      return;
    }
    if (act === 's-mode') { state.sentMode = el.getAttribute('data-mode'); save(); render(); return; }
    if (act === 'sent-cat') { state.sentCat = el.getAttribute('data-cat'); save(); render(); return; }
    if (act === 'en-cat') { state.enCat = el.getAttribute('data-cat'); save(); render(); return; }
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      document.body.classList.remove('menu-open');
      Install.close();
    }
  });

  window.addEventListener('hashchange', function () {
    var h = (location.hash || '').replace('#', '');
    if (!VIEWS[h] || h === state.view) return;
    var inEn = LANGS.en.views.indexOf(h) !== -1;
    var inJa = LANGS.ja.views.indexOf(h) !== -1;
    if (inEn && !inJa) state.lang = 'en';
    else if (inJa && !inEn) state.lang = 'ja';
    state.view = h;
    save();
    render();
    window.scrollTo({ top: 0, behavior: 'auto' });
  });

  /* mobile swipe: close drawer */
  (function () {
    var sx = 0, sy = 0;
    document.addEventListener('touchstart', function (e) {
      if (!e.touches || !e.touches[0]) return;
      sx = e.touches[0].clientX; sy = e.touches[0].clientY;
    }, { passive: true });
    document.addEventListener('touchend', function (e) {
      if (!document.body.classList.contains('menu-open')) return;
      var t = e.changedTouches && e.changedTouches[0];
      if (!t) return;
      if (sx - t.clientX > 60 && Math.abs(sy - t.clientY) < 60) document.body.classList.remove('menu-open');
    }, { passive: true });
  })();

  /* ============================================================
     Boot
     ============================================================ */
  load();
  $$('[data-ico]').forEach(function (el) {
    el.innerHTML = ICONS[el.getAttribute('data-ico')] || '';
  });
  render();

  /* 홈 화면 추가(PWA) — 서비스 워커는 http(s)에서만 등록해요 */
  (function () {
    if (!('serviceWorker' in navigator)) return;
    if (!/^https?:$/.test(location.protocol)) return;
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () { });
    });
  })();

  window.__app = {
    state: state,
    counts: {
      hiragana: KANA_HIRA.length, katakana: KANA_KATA.length, words: WORDS.length,
      sentences: SENTENCES.length, english: ENGLISH.length,
      dialogue: DIALOGUE.length, situations: EN_SITUATIONS.length
    },
    go: go,
    setLang: setLang,
    install: Install
  };
})();

</script>
</body>
</html>
