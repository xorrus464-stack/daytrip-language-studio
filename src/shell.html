<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F9F7F3">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="한마디 여행 · 영어, 일본어 — 가나 연상 그림, 필수 단어장, 자주 쓰는 문장, 영어 한마디와 상황별 여행 회화. 듣고 따라 말하는 여행 언어 학습.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="한마디 여행">
<title>한마디 여행 · 영어와 일본어</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="{{ICON_SVG_DATA}}">
<link rel="apple-touch-icon" sizes="180x180" href="{{APPLE_ICON_DATA}}">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<style>
{{CSS}}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar" aria-label="주요 메뉴">
    <a class="brand" href="#home" data-act="nav" data-view="home">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="24" height="24"><path d="M6 12c0-3.3 2.7-6 6-6h8c3.3 0 6 2.7 6 6v3c0 3.3-2.7 6-6 6h-4.6l-5.1 4.1c-.7.5-1.6 0-1.6-.8V21C6.9 20.4 6 18.3 6 16v-4z" fill="#F9F7F3"/><circle cx="12" cy="14" r="1.4" fill="#1B4D3E"/><circle cx="16" cy="14" r="1.4" fill="#1B4D3E"/><circle cx="20" cy="14" r="1.4" fill="#1B4D3E"/></svg>
      </span>
      <span class="brand-text">
        <strong>한마디 여행</strong>
        <small>LESS WORDS, MORE WORLD</small>
      </span>
    </a>

    <p class="nav-label" id="navLabel">나의 작은 여행 준비</p>
    <nav class="nav" id="nav" aria-label="학습 메뉴"></nav>

    <div class="side-card">
      <div class="side-card-ico" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#1B4D3E" stroke-width="1.7" stroke-linecap="round"><path d="M4 14c2-1 3-3 3-5a5 5 0 0 1 10 0c0 3 2 4 3 5"/><path d="M8 18h8"/><path d="M10 21h4"/></svg>
      </div>
      <p class="side-card-title">조금씩, 더 넓은 세상으로</p>
      <p class="side-card-text">완벽한 문장보다<br>오늘 써볼 한마디.</p>
    </div>

    <button type="button" class="side-install" data-act="install">
      <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6.5" y="2.6" width="11" height="18.8" rx="3"/><path d="M12 8.2v6.6M9.2 12l2.8 2.8 2.8-2.8"/></svg>
      <span>홈 화면에 추가</span>
    </button>

    <div class="side-settings">
      <p class="side-label">발음 속도</p>
      <div class="seg seg-sm" role="group" aria-label="발음 속도">
        <button type="button" data-act="rate" data-rate="1" class="seg-btn" data-rate-btn="1">보통</button>
        <button type="button" data-act="rate" data-rate="0.85" class="seg-btn" data-rate-btn="0.85">천천히</button>
      </div>
      <p class="side-label">이 기기의 음성</p>
      <div class="voice-status" id="voiceStatus" aria-live="polite">확인 중…</div>
    </div>
  </aside>

  <div class="scrim" id="scrim" data-act="close-menu" aria-hidden="true"></div>

  <div class="content">
    <header class="topbar">
      <button type="button" class="menu-btn" data-act="open-menu" aria-label="메뉴 열기">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <p class="crumb"><span>나의 학습 공간</span><span class="crumb-sep">›</span><b id="crumbNow">오늘의 학습</b></p>
      <div class="topbar-right">
        <button type="button" class="ghost-btn install-btn" data-act="install" aria-label="홈 화면에 추가">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6.5" y="2.6" width="11" height="18.8" rx="3"/><path d="M12 8.2v6.6M9.2 12l2.8 2.8 2.8-2.8"/></svg>
          <span>홈 화면에 추가</span>
        </button>
        <button type="button" class="ghost-btn" data-act="test-voice">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 10v4h3l4 4V6L7 10H4z"/><path d="M16 9c1.3 1 1.3 5 0 6"/><path d="M19 6.5c2.6 2.2 2.6 8.8 0 11"/></svg>
          <span>발음 확인</span>
        </button>
        <span class="top-chip" id="topVoiceChip">🔊 ja · en</span>
      </div>
    </header>

    <div class="langbar">
      <div class="langbar-in">
        <div class="lang-switch" role="group" aria-label="학습 언어 선택">
          <button type="button" class="lang-btn" data-act="lang" data-lang="en" aria-pressed="false">
            <span class="lang-flag" aria-hidden="true">🇺🇸</span><span class="lang-nm">영어</span><span class="lang-sub">English</span>
          </button>
          <button type="button" class="lang-btn" data-act="lang" data-lang="ja" aria-pressed="true">
            <span class="lang-flag" aria-hidden="true">🇯🇵</span><span class="lang-nm">일본어</span><span class="lang-sub">日本語</span>
          </button>
        </div>
        <p class="langbar-note" id="langNote">가나 92자부터 시작하는 일본어 코스</p>
      </div>
    </div>

    <main class="main" id="view" tabindex="-1"></main>
  </div>
</div>

<nav class="tabbar" id="tabbar" aria-label="하단 메뉴"></nav>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<div class="imodal" id="installModal" hidden>
  <div class="imodal-scrim" data-act="close-install"></div>
  <div class="imodal-card" role="dialog" aria-modal="true" aria-labelledby="installTitle" aria-describedby="installLead">
    <button type="button" class="imodal-x" data-act="close-install" aria-label="닫기">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <div class="imodal-head">
      <span class="imodal-ico" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="30" height="30"><rect width="32" height="32" rx="9" fill="#1B4D3E"/><path d="M8 13.2c0-2.3 1.9-4.2 4.2-4.2h7.6c2.3 0 4.2 1.9 4.2 4.2v1.6c0 2.3-1.9 4.2-4.2 4.2h-3.4l-3.8 3c-.6.5-1.5 0-1.5-.8v-2.4C9.6 18.1 8 16.6 8 14.8z" fill="#F9F7F3"/><circle cx="12.4" cy="14" r=".95" fill="#1B4D3E"/><circle cx="16" cy="14" r=".95" fill="#1B4D3E"/><circle cx="19.6" cy="14" r=".95" fill="#1B4D3E"/></svg>
      </span>
      <div>
        <h2 id="installTitle">홈 화면에 추가</h2>
        <p id="installLead">바탕화면 아이콘을 눌러 앱처럼 바로 열 수 있어요. 주소창 없이 전체 화면으로 열립니다.</p>
      </div>
    </div>
    <div class="imodal-body" id="installBody"></div>
  </div>
</div>

<script>
{{DATA}}
</script>
<script>
{{APP}}
</script>
</body>
</html>
